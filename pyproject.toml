[project]
name = "cathedra"
version = "0.1.0"
description = "Gerador de Wiki acadêmica no Obsidian a partir de ementas e slides de aula, com auditoria factual e linter estilístico."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.4",
    "pymupdf4llm>=0.0.17",
    "python-pptx>=1.0.2",
    "faster-whisper>=1.2.1",
    "av>=11.0.0,<14.0.0",
    "static-ffmpeg>=3.0",
]

[project.scripts]
mba-wiki = "mba_wiki.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mba_wiki"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "ctranslate2",
    "faster_whisper",
    "static_ffmpeg",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py", "*_test.py", "conftest.py"]
addopts = "-ra -q"
